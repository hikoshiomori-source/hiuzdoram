<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Todo — SQA demo (build F)</title>
<style>
  body{font-family:system-ui,Arial,sans-serif;background:#f5f5f5;margin:0;padding:40px 0;
       display:flex;justify-content:center}
  .app{background:#fff;width:420px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  h1{margin:0;padding:18px 0 8px;text-align:center;font-size:48px;font-weight:200;color:#b83f45}
  .new-todo{width:100%;padding:16px;font-size:17px;border:0;border-bottom:1px solid #ededed;
            box-sizing:border-box;outline:none}
  ul.todo-list{list-style:none;margin:0;padding:0}
  ul.todo-list li{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid #ededed}
  ul.todo-list li.completed label{color:#949494;text-decoration:line-through}
  .toggle{width:18px;height:18px;margin-right:12px}
  label{flex:1;font-size:16px;word-break:break-all}
  .destroy{border:0;background:none;color:#cc9a9a;font-size:20px;cursor:pointer;line-height:1}
  .footer{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;
          font-size:13px;color:#777}
  .filters{list-style:none;display:flex;gap:8px;margin:0;padding:0}
  .filters a{text-decoration:none;color:#777;padding:2px 7px;border:1px solid transparent;border-radius:3px}
  .filters a.selected{border-color:rgba(175,47,47,.3)}
</style>
</head>
<body>
<section class="app">
  <h1>todos</h1>
  <input id="new-todo" class="new-todo" placeholder="What needs to be done?" autofocus autocomplete="off">
  <ul class="todo-list" id="todo-list"></ul>
  <div class="footer">
    <span class="todo-count" id="todo-count"><strong>0</strong> items left</span>
    <ul class="filters">
      <li><a href="#/" id="filter-all" class="selected">All</a></li>
      <li><a href="#/active" id="filter-active">Active</a></li>
      <li><a href="#/completed" id="filter-completed">Completed</a></li>
    </ul>
  </div>
</section>

<script>
  var todos = [];

  function currentFilter() {
    if (location.hash === "#/active")    return "active";
    if (location.hash === "#/completed") return "completed";
    return "all";
  }

  function visible() {
    var f = currentFilter();
    return todos.filter(function (t) {
      if (f === "active")    return !t.done;
      if (f === "completed") return t.done;
      return true;
    });
  }

  function render() {
    var list = document.getElementById("todo-list");
    list.innerHTML = "";

    visible().forEach(function (t) {
      var li = document.createElement("li");
      if (t.done) li.className = "completed";

      var box = document.createElement("input");
      box.type = "checkbox";
      box.className = "toggle";
      box.checked = t.done;
      box.addEventListener("change", function () { t.done = box.checked; render(); });

      var label = document.createElement("label");
      label.textContent = t.title;

      var del = document.createElement("button");
      del.className = "destroy";
      del.textContent = "x";
      del.addEventListener("click", function () {
        todos = todos.filter(function (x) { return x !== t; });
        render();
      });

      li.appendChild(box); li.appendChild(label); li.appendChild(del);
      list.appendChild(li);
    });

    var left = todos.filter(function (t) { return !t.done; }).length;
    document.getElementById("todo-count").innerHTML =
        "<strong>" + left + "</strong> item" + (left === 1 ? "" : "s") + " left";

    ["all", "active", "completed"].forEach(function (name) {
      var el = document.getElementById("filter-" + name);
      el.className = (currentFilter() === name) ? "selected" : "";
    });
  }

  document.getElementById("new-todo").addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var title = this.value.trim();          // REQ-02: whitespace is trimmed
    if (title === "") { this.value = ""; return; }   // empty titles are not added
    var dup = todos.some(function (x) { return x.title === title; });
    if (dup) { this.value = ""; return; }
    todos.push({ title: title, done: false });
    this.value = "";
    render();
  });

  window.addEventListener("hashchange", render);
  render();
</script>
</body>
</html>
